[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-backend"
version = "0.1.0"
description = "FastAPI foundation for Nexus."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1.0", "pytest>=8.4,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
